<nav class="navbar" aria-label="Navegación principal">
  <a class="brand" routerLink="/" (click)="closeMenu()">
    <span class="brand-mark">A</span>
    <span class="brand-name">Andrea</span>
  </a>

  <ul id="primary-navigation" class="nav-links" [class.is-open]="menuOpen()">
    @for (link of links; track link.href) {
      <li>
        <a
          [routerLink]="link.href"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMenu()"
        >{{ link.label }}</a>
      </li>
    }
  </ul>

  <div class="actions">
    <button
      type="button"
      class="effect-toggle"
      [class.is-on]="sketch()"
      [attr.aria-pressed]="sketch()"
      [attr.aria-label]="sketch() ? 'Quitar efecto boceto' : 'Aplicar efecto boceto'"
      (click)="toggleSketch()"
    >
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path
          d="m14.7 6.3 3 3M4 20l1-3.8 9.3-9.3a1.8 1.8 0 0 1 2.5 0l1.3 1.3a1.8 1.8 0 0 1 0 2.5L8.8 20 4 20Z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>

    <button
      type="button"
      class="theme-toggle"
      [attr.aria-pressed]="theme() === 'dark'"
      [attr.aria-label]="theme() === 'dark' ? 'Activar modo claro' : 'Activar modo oscuro'"
      (click)="toggleTheme()"
    >
      @if (theme() === 'dark') {
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5" fill="currentColor" />
          <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <line x1="12" y1="2.5" x2="12" y2="5" />
            <line x1="12" y1="19" x2="12" y2="21.5" />
            <line x1="2.5" y1="12" x2="5" y2="12" />
            <line x1="19" y1="12" x2="21.5" y2="12" />
            <line x1="4.9" y1="4.9" x2="6.7" y2="6.7" />
            <line x1="17.3" y1="17.3" x2="19.1" y2="19.1" />
            <line x1="19.1" y1="4.9" x2="17.3" y2="6.7" />
            <line x1="6.7" y1="17.3" x2="4.9" y2="19.1" />
          </g>
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M20 14.5A8 8 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5Z" fill="currentColor" />
        </svg>
      }
    </button>

    <button
      type="button"
      class="menu-toggle"
      [class.is-open]="menuOpen()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="primary-navigation"
      aria-label="Abrir menú"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</nav>
