<section class="contact">
  <header class="contact-head">
    <h1 class="contact-title">Contacto</h1>
    <p class="contact-subtitle">¿Hablamos? Escríbeme y te respondo lo antes posible.</p>
  </header>

  <div class="contact-body">
    <aside class="contact-info">
      <a class="info-row" [href]="'mailto:' + info.email">
        <span class="info-label">Email</span>
        <span class="info-value">{{ info.email }}</span>
      </a>
      <a class="info-row" [href]="'tel:' + info.phone.replace(' ', '')">
        <span class="info-label">Teléfono</span>
        <span class="info-value">{{ info.phone }}</span>
      </a>
      <div class="info-row">
        <span class="info-label">Ubicación</span>
        <span class="info-value">{{ info.location }}</span>
      </div>
      <a class="info-row" [href]="info.linkedin" target="_blank" rel="noopener noreferrer">
        <span class="info-label">LinkedIn</span>
        <span class="info-value">Andrea Castro</span>
      </a>
    </aside>

    <form class="contact-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span class="field-label">Nombre</span>
        <input class="field-input" type="text" formControlName="name" autocomplete="name" />
        @if (form.controls.name.touched && form.controls.name.invalid) {
          <span class="field-error">Indica tu nombre.</span>
        }
      </label>

      <label class="field">
        <span class="field-label">Email</span>
        <input class="field-input" type="email" formControlName="email" autocomplete="email" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <span class="field-error">Introduce un email válido.</span>
        }
      </label>

      <label class="field">
        <span class="field-label">Mensaje</span>
        <textarea class="field-input" rows="5" formControlName="message"></textarea>
        @if (form.controls.message.touched && form.controls.message.invalid) {
          <span class="field-error">El mensaje debe tener al menos 10 caracteres.</span>
        }
      </label>

      <button class="submit" type="submit">Enviar mensaje</button>

      @if (sent()) {
        <p class="sent-note" role="status">Se abrirá tu gestor de correo con el mensaje listo para enviar. ¡Gracias!</p>
      }
    </form>
  </div>
</section>
